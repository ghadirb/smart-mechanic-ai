name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users (for example 1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Optional positive integer; leave empty to use the GitHub run number'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
      AI_BACKEND_BASE_URL: ${{ vars.AI_BACKEND_BASE_URL }}
      # کلید RSA عمومی مایکت؛ بدون آن BuildConfig خالی می‌شود و صفحه اعتبار فقط
      # «خرید اعتبار به‌زودی فعال می‌شود» را نشان می‌دهد.
      MYKET_IAB_PUBLIC_KEY: ${{ secrets.MYKET_IAB_PUBLIC_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Validate signing configuration
        run: |
          test -s "$ANDROID_KEYSTORE_PATH"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Validate Myket billing configuration
        run: |
          if [ -z "$MYKET_IAB_PUBLIC_KEY" ]; then
            echo "::error::MYKET_IAB_PUBLIC_KEY is empty - this release would ship with purchases disabled."
            exit 1
          fi

      - name: Build signed APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-mechanic-ai-${{ env.VERSION_NAME }}-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-mechanic-ai-${{ env.VERSION_NAME }}-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --title "Smart Mechanic AI ${{ env.VERSION_NAME }}" \
            --generate-notes
