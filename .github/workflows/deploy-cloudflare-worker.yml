name: Deploy Cloudflare Worker

# بک‌اند اصلی پروژه (backend/cloudflare/worker) -- رایگان، بدون نیاز به
# Google Cloud Billing. راهنمای کامل: backend/cloudflare/worker/README.md
#
# Secretهای لازم در گیت‌هاب (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   -- توکن API با دسترسی Workers Scripts:Edit + D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  -- شناسه حساب کلادفلر
#
# توجه: AVALAI_API_KEY و AVALAI_MODEL اینجا تنظیم نمی‌شوند -- آن‌ها یک‌بار و
# مستقیم با «wrangler secret put» روی خودِ Worker ست می‌شوند (رجوع کنید به
# README) و به این workflow یا هیچ فایل دیگری در گیت‌هاب وارد نمی‌شوند.

on:
  push:
    branches: [main]
    paths:
      - "backend/cloudflare/worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend/cloudflare/worker
        run: npm ci

      - name: Apply D1 migrations
        working-directory: backend/cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply smart-mechanic-ai-db --remote

      - name: Deploy Worker
        working-directory: backend/cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
