name: Deploy Firebase Functions (Legacy)

# LEGACY: بک‌اند اصلی پروژه دیگر Firebase نیست، به Cloudflare Workers + D1
# مهاجرت کرده (رجوع کنید به .github/workflows/deploy-cloudflare-worker.yml و
# backend/cloudflare/worker/README.md). این workflow فقط برای سازگاری/بازگشت
# احتمالی نگه داشته شده و دیگر با push خودکار اجرا نمی‌شود -- فقط دستی از تب
# Actions قابل اجراست.
#
# دیپلوی خودکار بک‌اند اعتباری Firebase (backend/firebase/functions).
# احراز هویت با Workload Identity Federation انجام می‌شود، نه کلید JSON —
# چون این پروژه ساخت کلید Service Account را با Org Policy مسدود کرده است.
# راهنمای کامل تنظیم WORKLOAD_IDENTITY_PROVIDER / FIREBASE_SA_EMAIL:
# backend/firebase/README.md

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: smart-mechanic-ai-153d3
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_SA_EMAIL }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: backend/firebase/functions
        run: npm ci

      - name: Deploy to Firebase
        working-directory: backend/firebase/functions
        run: npm run deploy -- --non-interactive
